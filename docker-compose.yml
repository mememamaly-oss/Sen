# P2-D (2026-10-31): production-grade local stack for the platform DB.
#
# Scope note (important): this service is ONLY the platform/tenant database
# (users, orgs, scans, findings, reports, twin). The ENGINE's per-target
# stores stay SQLite by design — deterministic, file-per-target under
# saas-data/stores — and are NOT migrated. See prisma/schema.prisma.
#
# Start:  POSTGRES_PASSWORD=... docker compose up -d
#
# TWO database identities (owner order 2026-10-31, items 1.2+2.3 —
# privilege separation; the audit trail's immutability trigger cannot
# block TRUNCATE or DISABLE TRIGGER, only missing privileges can):
#   1. MIGRATIONS + role provisioning (owner `burhan`, one-shot per deploy):
#        MIGRATION_DATABASE_URL=postgresql://burhan:<pw>@127.0.0.1:5432/burhan \
#          bunx prisma migrate deploy
#        MIGRATION_DATABASE_URL=postgresql://burhan:<pw>@127.0.0.1:5432/burhan \
#          BURHAN_APP_DB_PASSWORD=<random> bash scripts/db_app_role.sh
#      (the script is idempotent and prints the app URL)
#   2. THE APP (limited `burhan_app` — DML only, no TRUNCATE/DDL):
#        DATABASE_URL=postgresql://burhan_app:<BURHAN_APP_DB_PASSWORD>@127.0.0.1:5432/burhan
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: burhan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: burhan
    # loopback only — never expose the tenant DB publicly
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burhan -d burhan"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
