# P2-D (2026-10-31): production-grade local stack for the platform DB.
#
# Scope note (important): this service is ONLY the platform/tenant database
# (users, orgs, scans, findings, reports, twin). The ENGINE's per-target
# stores stay SQLite by design — deterministic, file-per-target under
# saas-data/stores — and are NOT migrated. See prisma/schema.prisma.
#
# Start:  POSTGRES_PASSWORD=... docker compose up -d
# Then:   DATABASE_URL=postgresql://sentinel:<pw>@127.0.0.1:5432/sentinel \
#           bunx prisma migrate deploy
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sentinel
    # loopback only — never expose the tenant DB publicly
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
