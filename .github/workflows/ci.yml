name: CI

# SECURITY (audit 2026-10-23): this pipeline is the regression wall for the
# remediation — it must fail closed: a red CI is never merged.
#
# P2 (2026-10-31) — ONE workflow file, six jobs:
#   web          — SaaS app: lint/typecheck/unit/integration/build on a REAL
#                  PostgreSQL service container (P2-D migration exercised on
#                  every run through prisma migrate deploy)
#   engine       — doctor + the python suite (incl. compliance parity tests)
#   secrets      — credential-pattern scan of tracked files
#   fixture      — a REAL scan of the bundled fixture (vulnapp): benchmark
#                  against ground truth + all five report formats as artifacts.
#                  Installs playwright+chromium: two ground-truth detections
#                  (xss_dom, browser-discovered jsform) REQUIRE the render
#                  engine — without it the run degrades to static fallback and
#                  the deterministic 38/38 record is unreachable (observed on
#                  the first CI runs: TP=36/FN=2).
#   drift        — compliance registry drift guard (generated file must match
#                  the engine source; stale check-ins can never ship)
#   real-targets — OWASP Juice Shop v20.3.0 (pinned) in a container: the
#                  honest EXTERNAL check — a real-world app the engine has
#                  never seen, scanned unauthenticated, reports as artifacts.
#                  First green run = the committed baseline floor; later runs
#                  gate on reproducing it (scripts/ci_real_target_scan.py).
#   reproducibility (2026-10-31, public-readiness PART 4B) — the SAME scan
#                  against the SAME target in TWO genuinely separate
#                  executions (fresh fixture process + fresh engine process
#                  per step); the compare step asserts byte-identical
#                  finding sets (merkle root + count + full-set sha256) and
#                  FAILS THE BUILD on any mismatch.
#   transparency (2026-10-31, PART 4A) — signs this run's entry for the
#                  public transparency log (project key from the
#                  TRANSPARENCY_SEED secret; skipped with a notice on
#                  forks/PRs where the secret is unavailable) and verifies
#                  the COMMITTED log + every committed evidence bundle with
#                  the independent verifier (tools/independent_verify.py —
#                  zero code shared with the signer). Tampering with any
#                  committed evidence turns CI red.
#   action-demo (2026-10-31, PART 5.3) — dogfoods the packaged GitHub
#                  Action (action.yml) exactly as an external consumer
#                  would invoke it: fixture target up, then `uses:` with
#                  inputs, then the contract asserted (signed result with
#                  findings + severity outputs). On workflow_dispatch it
#                  additionally runs the PUBLISHED TAG ref.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: SaaS app (lint / typecheck / tests / build) — PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: burhan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/burhan
      NEXTAUTH_SECRET: ci-only-secret-not-for-production
      BURHAN_DATA_DIR: /tmp/burhan-ci-data
      # PRIVILEGE SEPARATION (owner order 2026-10-31, items 1.2+2.3): the
      # owner identity (DATABASE_URL above) runs migrations + role
      # provisioning ONLY; the app identity burhan_app (DML only — no
      # TRUNCATE/DDL) is derived below and used by the unit + integration
      # suites, so CI proves on every push the app runs privilege-limited.
      BURHAN_APP_DB_PASSWORD: ci-burhan-app-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # the compliance parity test spawns `python3 -m burhan.cli compliance
      # --json` — the engine imports cryptography+blake3 at module level, so
      # the runner python needs them too
      - name: Install engine python dependencies (parity test)
        run: pip install -r requirements.txt

      - name: Prisma generate
        run: bunx prisma generate

      # The 2026-10-31 shared-store rate limiter made the login-limiter unit
      # tests PostgreSQL-backed; they run against THIS service container, so the
      # schema must be migrated before `bun run test` (fresh DB per run).
      # Missing step = P2021 "table RateLimitBucket does not exist" (observed).
      - name: Prisma migrate deploy
        run: bunx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/burhan

      # privilege separation (items 1.2+2.3): derive the LIMITED app
      # identity. Every later DB consumer in this job (unit tests, the
      # integration server + suites) runs as burhan_app — DML only.
      - name: Provision the limited app DB role (burhan_app — DML only)
        run: echo "APP_DB_URL=$(bash scripts/db_app_role.sh)" >> "$GITHUB_ENV"

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests (bun:test, unit files only — the integration suite
          self-spawns a dev server and is NOT reliable as a bare `bun test`;
          its supported path is the bash runner below)
        run: bun run test
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ env.APP_DB_URL }}

      # the runner consumes the OWNER url (migrations + role provisioning)
      # and re-derives the burhan_app URL itself; every suite then runs
      # with the limited identity (tests/privsplit.integration.test.ts
      # asserts it — a privilege regression is a red build)
      - name: Integration tests (bash-managed server — the supported path)
        run: bash scripts/run_integration_tests.sh
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/burhan

      # item 1.3 permanent proof (fail-closed audit): a REAL failure
      # injection — the app identity loses INSERT on AuditLog, then the
      # first-instance bootstrap runs over real HTTP against a fresh
      # throwaway DB. RED shape (action persisted, zero audit rows) fails
      # the build; the fixed shape rejects the action.
      - name: Audit fail-closed proof (audit-write failure rejects the action)
        run: bash scripts/verify_audit_fail_closed.sh
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/burhan

      - name: Production build
        run: bun run build
        env:
          NEXTAUTH_SECRET: ci-only-secret-not-for-production

  engine:
    name: Engine (doctor / python suite / compliance parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # requirements-dev = engine runtime deps + pytest (the python suite);
      # the pre-fix job died with "No module named pytest" — pytest is a
      # preinstalled convenience in the dev sandbox, NOT on a stock runner
      - name: Install engine + test dependencies
        run: pip install -r requirements-dev.txt

      - name: Engine doctor (19 checks)
        run: python3 -m burhan.cli doctor

      - name: Python security tests (incl. compliance mapping parity)
        run: python3 -m pytest tests/ -q

  secrets:
    name: Secret scan (tracked files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for credential patterns
        run: |
          # High-signal patterns only — the vulnapp fixture intentionally
          # contains the AWS-docs example key for scanner testing.
          if git grep -nE '(github_pat_[A-Za-z0-9_]{40,}|ghp_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{40,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- . ':!worklog.md'; then
            echo "::error::credential-like pattern found in tracked files"
            exit 1
          fi
          echo "no credential patterns in tracked files"

  fixture:
    name: Real fixture scan (canonical run + all report formats)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # DOGFOODING (owner order 2026-10-31, part 4.3): the engine's own
      # SARIF report of the bundled fixture is uploaded to the repository's
      # code-scanning (Security) tab — the tool's detections visible in the
      # same official surface every GitHub developer already trusts, not
      # only as a CI artifact.
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # playwright + chromium: the xss_dom execution phase and the
      # browser-discovered /vuln/jsform-reflect surface both need a REAL
      # render engine; without it the orchestrator falls back to static
      # analysis and 2 of the 38 ground-truth detections are unreachable
      - name: Install engine dependencies (+ playwright/chromium)
        run: |
          pip install -r requirements.txt playwright
          python3 -m playwright install --with-deps chromium

      - name: Canonical full-platform run (verified campaign config; store persisted)
        run: |
          python3 scripts/ci_fixture_run.py --out-dir "$RUNNER_TEMP/ci-fixture"

      - name: Benchmark regression gate (confusion vs ground truth)
        run: |
          python3 -m burhan.cli benchmark --race --out "$RUNNER_TEMP/ci-fixture/benchmark.json"
          python3 - <<'PY'
          import json, os
          b = json.load(open(os.environ["RUNNER_TEMP"] + "/ci-fixture/benchmark.json"))
          c = b["confusion"]
          print(f"P/R/F1: {b['precision']}/{b['recall']}/{b['f1']} confusion: {c}")
          # the deterministic record: TP=38 FP=0 FN=0 TN=37, F1=1.0
          # (evidence/full-reverify/fixtures-vulnapp/benchmark.json)
          assert b["f1"] == 1.0, f"benchmark F1 regressed: {b['f1']}"
          assert c["TP"] == 38 and c["FP"] == 0, f"confusion regressed: {c}"
          print("benchmark regression gate OK")
          PY

      - name: Export all five report formats from the store
        run: |
          F="$RUNNER_TEMP/ci-fixture"
          RUN_ID=$(python3 -c "import json;print(json.load(open('$F/scan.json'))['run_id'])")
          for fmt in html json sarif executive glass; do
            python3 -m burhan.cli report --db "$F/store.db" \
              --run-id "$RUN_ID" --format "$fmt" --out "$F/report.$fmt"
          done
          python3 -m burhan.cli compliance --json > "$F/compliance.json"

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fixture-scan
          path: |
            ${{ runner.temp }}/ci-fixture/scan.json
            ${{ runner.temp }}/ci-fixture/report.*
            ${{ runner.temp }}/ci-fixture/benchmark.json
            ${{ runner.temp }}/ci-fixture/compliance.json
          if-no-files-found: error

      # DOGFOODING (part 4.3): the engine's own findings for its fixture,
      # in the repository's Security tab (code-scanning). Code-scanning
      # requires artifact URIs to be REPO-RELATIVE FILE PATHS — the raw
      # engine SARIF carries the scanned TARGET's absolute http URLs (first
      # attempt failed: "SARIF URI scheme http did not match the checkout
      # URI scheme file"). The fixture IS a repo file: each result's
      # artifact is remapped to fixtures/vulnapp.py, and the exact target
      # URL stays in the result message (verbatim, already there).
      - name: Dogfood — remap SARIF artifacts to the fixture source file
        working-directory: ${{ runner.temp }}/ci-fixture
        run: |
          python3 - <<'PY'
          import json
          p = "report.sarif"
          d = json.load(open(p, encoding="utf-8"))
          n = 0
          for run in d.get("runs", []):
              for res in run.get("results", []):
                  for loc in res.get("locations", []):
                      al = loc.get("physicalLocation", {}).get("artifactLocation", {})
                      if str(al.get("uri", "")).startswith("http"):
                          al["uri"] = "fixtures/vulnapp.py"
                          n += 1
          json.dump(d, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          print(f"remapped {n} artifact URIs to the fixture source file")
          PY
      - name: Dogfood — upload the engine's own SARIF to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ runner.temp }}/ci-fixture/report.sarif
          category: burhan-engine-fixture

  drift:
    name: Compliance registry drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine dependencies (cryptography + blake3)
        run: pip install -r requirements.txt

      - name: Regenerate and compare (stale registry can never ship)
        run: |
          python3 scripts/gen_compliance_registry.py
          if ! git diff --exit-code -- src/lib/compliance-registry.json; then
            echo "::error::src/lib/compliance-registry.json is stale — regenerate with: python3 scripts/gen_compliance_registry.py"
            exit 1
          fi
          echo "registry in sync with burhan/compliance.py"

  real-targets:
    name: Real target (OWASP Juice Shop v20.3.0 — container, unauth)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine dependencies (+ playwright — the SPA is client-rendered)
        run: |
          pip install -r requirements.txt playwright
          python3 -m playwright install --with-deps chromium

      - name: Start OWASP Juice Shop (pinned real-world target)
        run: |
          docker run -d --name juice -p 3000:3000 bkimminich/juice-shop:v20.3.0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/ > /dev/null; then
              echo "juice-shop up (attempt $i)"; exit 0
            fi
            sleep 2
          done
          echo "::error::juice-shop did not come up in 120s"
          docker logs juice | tail -50
          exit 1

      - name: Scan the real target (baseline floor enforced)
        run: python3 scripts/ci_real_target_scan.py --base http://127.0.0.1:3000 --out-dir "$RUNNER_TEMP/real" --floor evidence/real-targets/juice-shop/floor.json

      - name: Upload real-target artifacts
        uses: actions/upload-artifact@v4
        with:
          name: real-target-juiceshop
          path: |
            ${{ runner.temp }}/real/scan.json
            ${{ runner.temp }}/real/summary.json
            ${{ runner.temp }}/real/report.json
            ${{ runner.temp }}/real/report.sarif
            ${{ runner.temp }}/real/compliance.json
          if-no-files-found: error

  reproducibility:
    name: Reproducibility attestation (two independent executions)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # playwright + chromium: the canonical run needs the render engine for
      # the browser-dependent detections (same requirement as the fixture job)
      - name: Install engine dependencies (+ playwright/chromium)
        run: |
          pip install -r requirements.txt playwright
          python3 -m playwright install --with-deps chromium

      - name: Execution A (fresh fixture process + fresh engine process)
        run: python3 scripts/repro_attest.py --tag a --out-dir "$RUNNER_TEMP/repro"

      - name: Execution B (fresh fixture process + fresh engine process)
        run: python3 scripts/repro_attest.py --tag b --out-dir "$RUNNER_TEMP/repro"

      - name: HARD GATE — both executions must be byte-identical
        run: python3 scripts/repro_attest.py --compare "$RUNNER_TEMP/repro"

      - name: Upload reproducibility attestations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-attestation
          path: |
            ${{ runner.temp }}/repro/attestation-a.json
            ${{ runner.temp }}/repro/attestation-b.json
            ${{ runner.temp }}/repro/attestation.json
          if-no-files-found: error

  transparency:
    name: Transparency log (sign this run + verify the committed log)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine dependencies (+ playwright — the canonical run needs the render engine)
        run: |
          pip install -r requirements.txt playwright
          python3 -m playwright install --with-deps chromium

      - name: Tamper battery (5 checks, ephemeral keys, independent verifier)
        run: python3 tools/transparency_selftest.py --out "$RUNNER_TEMP/selftest"

      - name: Canonical scan run (the run to be signed)
        run: python3 scripts/ci_fixture_run.py --port 8777 --out-dir "$RUNNER_TEMP/t"

      - name: Sign the transparency entry (project key; skipped when the secret is unavailable)
        env:
          TRANSPARENCY_SEED: ${{ secrets.TRANSPARENCY_SEED }}
        run: |
          if [ -z "$TRANSPARENCY_SEED" ]; then
            echo "::notice::TRANSPARENCY_SEED not available (fork/PR context) — entry signing skipped; committed-log verification still runs below"
            exit 0
          fi
          set +e
          python3 tools/append_transparency.py --report "$RUNNER_TEMP/t/scan.json" \
            --label "fixture:vulnapp (CI)" --no-append \
            --seed-hex "$TRANSPARENCY_SEED" \
            --bundle-root "$RUNNER_TEMP/t-bundle" \
            --out-entry "$RUNNER_TEMP/t/entry.json" 2>&1 | tee /tmp/sign.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            # a deterministic run (fixed seed -> fixed run_id) whose entry is
            # already recorded in the committed log is NOT a failure — the
            # duplicate refusal is the appender working as designed, and the
            # committed-log verification below re-proves that exact entry
            if grep -q "already in the log" /tmp/sign.log; then
              echo "::notice::this run's entry is already recorded (deterministic run_id) — the committed-log verification below re-proves it"
              exit 0
            fi
            exit 1
          fi

      - name: Upload the signed entry + bundle (adopted into the repo by the gated push)
        uses: actions/upload-artifact@v4
        with:
          name: transparency-entry
          path: |
            ${{ runner.temp }}/t/entry.json
            ${{ runner.temp }}/t/scan.json
            ${{ runner.temp }}/t-bundle/**
          if-no-files-found: warn

      - name: Verify the COMMITTED transparency log + every committed bundle
        run: |
          python3 tools/independent_verify.py verify-log transparency-log/log.jsonl \
            --pubkey transparency-log/pubkey.hex
          found=0
          for d in evidence/transparency-log/*/; do
            case "$d" in *selftest*) continue ;; esac
            [ -f "$d/entry.json" ] || continue
            found=1
            python3 tools/independent_verify.py verify-bundle "$d" \
              --pubkey transparency-log/pubkey.hex \
              --log transparency-log/log.jsonl
          done
          if [ "$found" = "1" ]; then echo "committed bundles verified"; else echo "no committed bundles yet (first cycle)"; fi

  action-demo:
    name: GitHub Action dogfood (this commit, local ref)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Start the fixture target (the "external app" being scanned)
        run: |
          PORT=8788 nohup python3 fixtures/vulnapp.py > /tmp/fixture.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8788/ > /dev/null; then echo "fixture up (attempt $i)"; exit 0; fi
            sleep 1
          done
          echo "::error::fixture did not come up in 30s"
          cat /tmp/fixture.log
          exit 1

      # NOTE (observed on run 41156398201): GitHub resolves EVERY `uses:` ref
      # at job-preparation time, before step `if:` conditions are evaluated —
      # a tag-ref step inside this job broke the job until the tag existed.
      # The tag-usage test therefore lives in its own dispatch-only job below.
      - name: Run the action (local ref — this commit's action.yml)
        uses: ./
        with:
          target: http://127.0.0.1:8788
          out: burhan-result.json
          allow-private: "true"

      - name: Assert the action's contract (signed result, findings, outputs)
        run: |
          test -f burhan-result.json
          python3 - <<'PY'
          import json
          rep = json.load(open("burhan-result.json"))
          audit = rep.get("audit") or {}
          assert audit.get("merkle_root"), "result must carry a signed audit block"
          assert audit.get("signature_b64"), "result must carry a signature"
          assert len(rep.get("findings", [])) > 0, "fixture scan must produce findings"
          print("action contract OK:", len(rep["findings"]), "findings, root",
                audit["merkle_root"][:16] + "…")
          PY

  action-demo-tag:
    name: GitHub Action dogfood (published tag — external resolution)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Start the fixture target
        run: |
          PORT=8789 nohup python3 fixtures/vulnapp.py > /tmp/fixture.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8789/ > /dev/null; then echo "fixture up (attempt $i)"; exit 0; fi
            sleep 1
          done
          echo "::error::fixture did not come up in 30s"
          cat /tmp/fixture.log
          exit 1

      # the EXTERNAL-CONSUMER path: resolve the action by its published tag,
      # exactly as a third-party workflow would
      # LEGACY-REF LIVE PROBE (owner order, part 1.8). The official docs
      # page ('Renaming a repository') states: "GitHub will not redirect
      # calls to an action hosted by a renamed repository. Any workflow that
      # uses that action will fail with the error `repository not found`."
      # LIVE-EVIDENCE (2026-10-31, dispatch run 41210962177 on this repo):
      # the pre-rename reference mememamaly-oss/Sen@v4.5.0 DID resolve — the
      # runner logged "Download action repository 'mememamaly-oss/Sen@v4.5.0'
      # (SHA:33008a7...)" and the action completed a full signed scan (19
      # findings, contract asserted). Observed behavior CONTRADICTS the docs
      # page; this probe stays continue-on-error so it keeps recording the
      # actual behavior on every dispatch. If GitHub ever starts enforcing
      # the documented behavior, this step turns red and the note in
      # docs/github-action.md must be updated. Consumers should still move
      # to mememamaly-oss/burhan@v5.0.0 — the redirect is observed-working,
      # not a guarantee.
      - name: Run the action — LEGACY pre-rename ref (mememamaly-oss/Sen@v4.5.0, expected to fail per docs)
        uses: mememamaly-oss/Sen@v4.5.0
        continue-on-error: true
        with:
          target: http://127.0.0.1:8789
          out: legacy-sen-result.json
          allow-private: "true"

      - name: Assert the legacy-ref action's contract
        run: |
          test -f legacy-sen-result.json
          python3 - <<'PY'
          import json
          rep = json.load(open("legacy-sen-result.json"))
          audit = rep.get("audit") or {}
          assert audit.get("merkle_root"), "result must carry a signed audit block"
          assert audit.get("signature_b64"), "result must carry a signature"
          assert len(rep.get("findings", [])) > 0, "fixture scan must produce findings"
          print("legacy-ref action contract OK:", len(rep["findings"]), "findings")
          PY

      - name: Run the action (mememamaly-oss/burhan@v5.0.0 — current published tag)
        uses: mememamaly-oss/burhan@v5.0.0
        with:
          target: http://127.0.0.1:8789
          out: burhan-result.json
          allow-private: "true"

      - name: Assert the action's contract
        run: |
          test -f burhan-result.json
          python3 - <<'PY'
          import json
          rep = json.load(open("burhan-result.json"))
          audit = rep.get("audit") or {}
          assert audit.get("merkle_root"), "result must carry a signed audit block"
          assert audit.get("signature_b64"), "result must carry a signature"
          assert len(rep.get("findings", [])) > 0, "fixture scan must produce findings"
          print("tag-resolution action contract OK:", len(rep["findings"]), "findings")
          PY
