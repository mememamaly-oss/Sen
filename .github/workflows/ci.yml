name: CI

# SECURITY (audit 2026-10-23): this pipeline is the regression wall for the
# remediation — lint + typecheck + unit/integration tests + build + engine
# doctor + secret scan. It must fail closed: a red CI is never merged.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  web:
    name: SaaS app (lint / typecheck / tests / build)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./ci-test.db"
      NEXTAUTH_SECRET: "ci-only-secret-not-for-production"
      SENTINEL_DATA_DIR: "/tmp/sentinel-ci-data"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Prisma generate
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit + integration tests (bun:test)
        run: bun test
        env:
          NODE_ENV: test

      - name: Production build
        run: bun run build

  engine:
    name: Engine (doctor / network policy / fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Engine doctor (19 checks)
        run: python3 -m sentinel.cli doctor

      - name: Python security tests
        run: python3 -m pytest tests/ -q

  secrets:
    name: Secret scan (tracked files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for credential patterns
        run: |
          # High-signal patterns only — the vulnapp fixture intentionally
          # contains the AWS-docs example key for scanner testing.
          if git grep -nE '(github_pat_[A-Za-z0-9_]{40,}|ghp_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{40,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- . ':!worklog.md'; then
            echo "::error::credential-like pattern found in tracked files"
            exit 1
          fi
          echo "no credential patterns in tracked files"
