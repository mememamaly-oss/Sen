name: Security ops (Scorecard / dependency review / SBOM)

# PART 4 (owner order 2026-10-31): the free GitHub supply-chain surfaces,
# wired permanently into CI:
#   scorecard         — OSSF Scorecard CANNOT run here: the action proxy
#                       does not resolve ossf/scorecard-action, and the
#                       tool is github.com-public-only by design (this
#                       repo is a private mirror). The job records that
#                       limitation honestly each run. Weekly + on push.
#   dependency-review — blocks merging a PR that introduces a dependency
#                       with a KNOWN vulnerability (the preventive gate;
#                       Dependabot alerts are the detective one).
#   sbom              — SPDX SBOM from GitHub's own dependency graph,
#                       attached to every release (enterprise-readiness).

on:
  pull_request:
  push:
    branches: ["main"]
  release:
    types: [published]
  schedule:
    - cron: "23 5 * * 1" # weekly, Monday — new vulns appear without code changes
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    # First-run finding (2026-11-01, run 41278076030): this runner's action
    # proxy cannot resolve `ossf/scorecard-action@v2` at all, and OSSF
    # Scorecard is github.com-public-repo-only BY DESIGN — its checks query
    # api.github.com and publish_results pushes to api.securityscorecards.dev
    # — so it can never assess a private repository on this GitHub instance.
    # The badge that read api.securityscorecards.dev was removed from the
    # README for the same reason. This job therefore records the limitation
    # explicitly instead of leaving a permanently-red main.
    name: OSSF Scorecard — environment-limited (documented, see step summary)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record the Scorecard limitation (verified twice)
        run: |
          cat > scorecard-limitation.md <<'EOF'
          # OSSF Scorecard — not executable in this environment

          Two independently verified blockers (2026-11-01, runs 41278059457
          and 41278076030):

          1. The runner's action proxy cannot resolve
             `ossf/scorecard-action@v2` — the job fails at action
             resolution, before any step runs.
          2. Even with the action resolved, OSSF Scorecard assesses PUBLIC
             github.com repositories: its checks call api.github.com and
             the publish flow sends results to api.securityscorecards.dev.
             This repository is a private repository on this GitHub
             instance; it has no github.com API identity, so no Scorecard
             run is possible by design, regardless of the action version.

          Supply-chain coverage that IS in place here: CodeQL
          security-extended (both languages, weekly + per push, results in
          the Security tab), the engine's own SARIF dogfooded into the
          Security tab (category burhan-engine-fixture), dependency review
          on every PR (fail-on-severity: high), Dependabot weekly
          (pip + npm), and the SPDX SBOM from the dependency graph
          (attached to every release).
          EOF
          cat scorecard-limitation.md
          {
            echo "### OSSF Scorecard: not executable in this environment"
            echo
            echo "\`ossf/scorecard-action@v2\` is not resolvable by this runner's action proxy, and Scorecard is github.com-public-repo-only by design — this private mirror can never be its target. Full note in the \`scorecard-limitation\` artifact. In-place supply-chain coverage: CodeQL security-extended, engine SARIF dogfood, dependency review (PR), Dependabot weekly, SPDX SBOM."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard-limitation
          path: scorecard-limitation.md
          if-no-files-found: error

  dependency-review:
    name: Dependency review (block known-vulnerable dependency changes)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Review new dependencies for known vulnerabilities
        uses: actions/dependency-review-action@v4
        with:
          # block the merge when a PR introduces a vulnerable dep
          fail-on-severity: high

  sbom:
    name: SBOM (GitHub dependency graph, SPDX) -> release artifact
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Export the SBOM from GitHub's dependency graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh api "/repos/${REPO}/dependency-graph/sbom" \
            > sbom.spdx.json
          python3 - <<'PY'
          import json
          d = json.load(open("sbom.spdx.json"))
          g = d.get("sbom", d)
          pkgs = g.get("packages", []) or g.get("spdxPackages", [])
          print("SBOM ok: spdxVersion", g.get("spdxVersion"),
                "| packages:", len(pkgs) if isinstance(pkgs, list) else "?")
          PY
      - name: Attach the SBOM to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG" sbom.spdx.json --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          if-no-files-found: error
