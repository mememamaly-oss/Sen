<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30">
  <!-- Burhan / برهان mark: the Arabic letter ب (ba) — a wide bowl with its
       single dot beneath — on the same dark rounded square as the previous
       mark. Generated for the v5.0.0 rename (part 1.6). -->
  <defs>
    <style type="text/css">
      .z-bg{fill:#2D2D2D;stroke:#FFFFFF;stroke-width:0.6317;stroke-miterlimit:10;}
      .z-fg{fill:none;stroke:#FFFFFF;stroke-width:2.4;stroke-linecap:round;}
      .z-dot{fill:#FFFFFF;}
      .z-breathe{animation:breathe 2.5s ease-in-out infinite;}
      @keyframes breathe{0%,100%{opacity:0.7;}50%{opacity:1;}}
    </style>
  </defs>
  <rect class="z-bg" x="1.49" y="1.49" width="27.02" height="27.02" rx="4" ry="4"/>
  <g class="z-breathe">
    <path class="z-fg" d="M 6.5 13.2 Q 15 21.4 23.5 13.2"/>
    <circle class="z-dot" cx="15" cy="21.6" r="1.7"/>
  </g>
</svg>
