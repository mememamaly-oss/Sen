# ─────────────────────────────────────────────────────────────────────────────
# Burhan — GitLab CI template (P2-F, 2026-10-31)
#
# Usage in YOUR .gitlab-ci.yml:
#
#   include:
#     - project: "mememamaly-oss/burhan"
#       ref: main
#       file: "integrations/gitlab-ci/sen-scan.gitlab-ci.yml"
#
#   burhan:scan:
#     extends: .burhan:scan
#     variables:
#       BURHAN_TARGET_URL: "https://staging.example.internal"
#
# EXPECTS the engine tree at the project root (self-hosted mirror/vendored
# copy of Burhan — the source is private, so there is no public clone step);
# the job installs its python dependencies itself.
# The job checks out the engine, runs a REAL scan against BURHAN_TARGET_URL,
# exports all five report formats (HTML/JSON/SARIF/EXECUTIVE/GLASS), applies
# the CI exit contract (0 clean / 1 policy / 2 incomplete / 3 engine), and
# publishes everything as pipeline artifacts.
#
# SECURITY: point this at targets you are AUTHORIZED to scan. The engine
# refuses private-network targets unless --allow-private is explicitly set
# here (it is NOT, by design).
# ─────────────────────────────────────────────────────────────────────────────

.burhan:scan:
  image: python:3.12-slim
  variables:
    BURHAN_TARGET_URL: ""        # required — the application under test
    BURHAN_MAX_PAGES: "25"
    BURHAN_TIMEOUT: "12"
  script:
    - test -n "$BURHAN_TARGET_URL" || { echo "set BURHAN_TARGET_URL"; exit 1; }
    - pip install -r requirements.txt
    - python3 -m burhan.cli scan "$BURHAN_TARGET_URL"
        --max-pages "$BURHAN_MAX_PAGES"
        --timeout "$BURHAN_TIMEOUT"
        --db store.db --out result.json
    - RUN_ID=$(python3 -c "import json;print(json.load(open('result.json'))['run_id'])")
    - for fmt in html json sarif executive glass; do
        python3 -m burhan.cli report --db store.db --run-id "$RUN_ID" --format "$fmt" --out "report.$fmt" || true;
      done
    - python3 -m burhan.cli compliance --json > compliance.json
    # CI gate with the explicit exit contract (fail the pipeline on policy)
    - python3 -m burhan.cli report --db store.db --run-id "$RUN_ID" --format executive --out exec.json --ci || EXIT=$?
    - exit ${EXIT:-0}
  artifacts:
    when: always
    paths:
      - result.json
      - report.*
      - compliance.json
      - exec.json
    expire_in: 30 days
